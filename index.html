    <!-- JSON-LD FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Dónde está Bandurria?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Estamos en Montenegro 133, Chacarita, CABA. Atendemos de lunes a viernes de 9.15 a 13.30 y de 14.30 a 17.45 hs. También podés escribirnos por WhatsApp o dejarnos tu consulta en el formulario de contacto."
            }
          },
          {
            "@type": "Question",
            "name": "¿Hacen impresión de gran formato?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Imprimimos hasta 320 cm de ancho con tinta UV de gran durabilidad, tanto para interior como para exterior, sobre todo tipo de lonas y vinilos, cuerina, lienzo canvas, papel fotográfico y más."
            }
          },
          {
            "@type": "Question",
            "name": "¿Imprimen vinilos para vidrieras?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Trabajamos con todos los tipos de vinilo para vidriera: base blanca, microperforado y cristal, con colocación en el punto de venta y cobertura a nivel nacional."
            }
          },
          {
            "@type": "Question",
            "name": "¿Realizan colocación?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Hacemos la colocación de vinilos en punto de venta, la fabricación e instalación de marquesinas y el tensado de lonas, con cobertura en todo el país."
            }
          },
          {
            "@type": "Question",
            "name": "¿Trabajan con agencias de publicidad?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Trabajamos habitualmente con agencias de publicidad y estudios de diseño, acompañando sus proyectos desde la preimpresión hasta la entrega y la colocación."
            }
          },
          {
            "@type": "Question",
            "name": "¿Hacen material POP?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, es una de nuestras especialidades: salientes, cenefas, stoppers, movies, headers, cubrepallets, punteras, colgantes e islas, además de exhibidores de plástico corrugado de piso y de mostrador."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué materiales imprimen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Imprimimos sobre rígidos —PVC, PAI, plástico corrugado, PET, acrílico, cartulina y madera— y sobre flexibles —lonas, vinilos, cuerina, lienzo canvas y papel fotográfico—, con tintas color y blanco. También hacemos piezas en offset y digital sobre papel."
            }
          },
          {
            "@type": "Question",
            "name": "¿Trabajan con empresas y marcas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Producimos para marcas y empresas de retail, consumo masivo, gastronomía, telecomunicaciones, laboratorios y automotriz, entre otros rubros. En la sección Confían en nosotros podés ver algunas de ellas."
            }
          },
          {
            "@type": "Question",
            "name": "¿Realizan trabajos de gran volumen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Producimos íntegramente en planta, lo que nos permite tomar desarrollos de gran escala con tiempos y costos controlados, tanto en gran formato y rígidos como en offset para tiradas largas."
            }
          }
        ]
      }
    </script>
