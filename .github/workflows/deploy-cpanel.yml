name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.FTP_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Build
        env:
          VITE_BASE: /
        run: pnpm build

      - name: Block indexing on the test environment
        if: ${{ vars.DEPLOY_NOINDEX != 'false' }}
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml
          printf '\nHeader set X-Robots-Tag "noindex, nofollow"\n' >> dist/.htaccess

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
